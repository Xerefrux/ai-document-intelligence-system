[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "1.0.0"
description = "Document intelligence for invoices: ingest PDF, image, Excel and CSV files, extract structured data, validate it, and search it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "numpy>=1.26",
  "pillow>=10.3",
  "pypdfium2>=4.30",
  "rapidfuzz>=3.9",
  "charset-normalizer>=3.3",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "defusedxml>=0.7.1",
  "opencv-python>=4.9",
  "rapidocr-onnxruntime>=1.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "reportlab>=4",
  "xlwt>=1.3",
  "python-docx>=1.1",
]

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools.packages.find]
include = ["docintel*"]

[tool.setuptools.package-data]
docintel = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "slow: tests that take several seconds (OCR, large files)",
  "tesseract: tests that need the Tesseract binary",
]
